[theme]
base = "dark"
primaryColor = "#42D9FF"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#101D30"
textColor = "#E6F3FF"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseRadius = "1rem"
buttonRadius = "full"
borderColor = "#233A55"
dataframeBorderColor = "#233A55"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
    "#42D9FF",
    "#9B8CFF",
    "#35D6A4",
    "#FFB86B",
    "#FF6FAE",
    "#78A9FF",
]
chartSequentialColors = [
    "#10243A",
    "#15516B",
    "#168EAA",
    "#42D9FF",
]
